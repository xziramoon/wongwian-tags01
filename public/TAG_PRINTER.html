<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TAG_PRINTER — เครื่องพิมพ์ป้ายราคาปลายทาง</title>
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:wght@300;400;600;700&family=Mitr:wght@400;500;600&family=Prompt:wght@300;400;600;700&family=Sarabun:wght@300;400;600;700&family=Potta+One&family=Black+Han+Sans&family=Yuji+Boku&family=Yuji+Syuku&family=Yuji+Mai&family=Zen+Kurenaido&family=Reggae+One&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@900&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<style>
  /* ============ base vars (subset of wongwian-tags global.css :root) ============ */
  :root {
    --ac: #4b47e6;
    --ac-d: #3a36c4;
    --ac-soft: #ecebff;
    --ac-tint: #f4f3ff;
    --ink: #171725;
    --txt: #171725;
    --txt2: #767690;
    --surface: #ffffff;
    --surface2: #f6f6fb;
    --canvas: #e8e9f1;
    --ln: #ececf3;
    --ln2: #dbdbe7;
    --g: #12a150;
    --g-soft: #e6f6ec;
    --r: #e43c3c;
    --r-soft: #fcebeb;
    --o: #db8a0a;
    --o-soft: #fdf3e1;
    --f-ui: 'IBM Plex Sans Thai', sans-serif;

    /* tag render vars — same defaults as wongwian-tags DEFAULT_CONFIG, overwritten live by applyCSSVars() */
    --f-tag: 'Kanit', sans-serif;
    --tag-w: 5.4cm;
    --tag-h: 4cm;
    --large-w: 11.4cm;
    --large-h: 6cm;
    --price-sz: 46px;
    --dual-price-sz: 28px;
    --meta-sz: 10px;
    --ribbon-f-sz: 10px;
    --ribbon-x: -32px;
    --ribbon-y: 15px;
    --oos-w: 5.4cm;
    --oos-h: 1.4cm;
    --oos-sz: 22px;
    --fridge-w: 6cm;
    --fridge-h: 3.5cm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--f-ui); background: var(--canvas); color: var(--txt); -webkit-font-smoothing: antialiased; }

  /* ============ toolbar (screen-only status/control bar) ============ */
  .toolbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--surface); border-bottom: 1px solid var(--ln2);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 2px 12px rgba(23,23,37,.06);
  }
  .tb-title { font-weight: 700; font-size: 16px; color: var(--ink); white-space: nowrap; }
  .tb-status { display: flex; align-items: center; gap: 9px; padding: 7px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--ln2); }
  .tb-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--o); flex-shrink: 0; box-shadow: 0 0 0 4px rgba(219,138,10,.16); animation: pulse 1.4s ease infinite; }
  .tb-dot.connected { background: var(--g); box-shadow: 0 0 0 4px rgba(18,161,80,.16); animation: none; }
  .tb-dot.offline { background: var(--r); box-shadow: 0 0 0 4px rgba(228,60,60,.16); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.82)} }
  .tb-status-text { font-size: 13.5px; font-weight: 600; color: var(--txt2); }
  .tb-info { font-size: 12.5px; color: var(--txt2); line-height: 1.5; }
  .tb-info b { color: var(--ink); }
  .tb-spacer { flex: 1; }
  .tb-btn {
    font-family: var(--f-ui); font-size: 13.5px; font-weight: 600; border: 1.5px solid var(--ln2);
    background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 14px; cursor: pointer;
  }
  .tb-btn:hover { border-color: var(--ac); color: var(--ac-d); background: var(--ac-tint); }
  .tb-btn.primary { background: var(--ac); border-color: var(--ac); color: #fff; }
  .tb-btn.primary:hover { background: var(--ac-d); }

  /* ============ screen preview canvas ============ */
  .page-scroll { padding: 28px; display: flex; justify-content: center; }
  #print-area {
    background: #fff;
    width: 210mm;
    min-height: 297mm;
    padding: 8mm;
    box-shadow: 0 1px 0 rgba(23,23,37,.04), 0 40px 80px rgba(23,23,37,.18);
    display: flex;
    flex-wrap: wrap;
    gap: 1.5mm;
    align-content: flex-start;
    position: relative;
    border-radius: 6px;
  }
  .empty-msg { width: 100%; text-align: center; color: #a6a6bc; margin-top: 120px; font-family: var(--f-ui); font-size: 15px; letter-spacing: .3px; }

  @media print {
    .toolbar { display: none !important; }
    .page-scroll { padding: 0 !important; display: block !important; }
    body { background: #fff !important; }
  }

  /* ============================================================
   * ⚠️ ห้ามแก้ — คัดลอกมาจาก src/styles/tag.css ของ wongwian-tags ตรงตัว
   * (.price-tag layout ทั้งชุด + @media print) เพื่อให้เครื่องพิมพ์ปลายทาง
   * เรนเดอร์ป้ายราคาออกมาเหมือนต้นทาง 100% — ถ้าแก้ต้นทาง ต้องแก้ที่นี่ด้วย
   * ============================================================ */
  .price-tag { background:#fff; border:2px solid #000; display:flex; flex-direction:column; box-sizing:border-box; page-break-inside:avoid; font-family:var(--f-tag); position:relative; height: var(--tag-h); width: var(--tag-w); overflow:hidden; }
  .tag-ribbon { position: absolute; top: var(--ribbon-y); right: var(--ribbon-x); background: #000; color: #fff; font-size: var(--ribbon-f-sz); font-weight: 800; padding: 3px 45px; transform: rotate(45deg); z-index: 10; text-align: center; }
  .tag-header  { background:#000; color:#fff; text-align:center; font-size:10px; font-weight:800; padding:3px 0; letter-spacing:1px; flex: 0 0 18px; overflow: visible; line-height:1.3; }
  .tag-name-area { flex: 0 0 36px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px 4px; border-bottom:1px solid #000; overflow: hidden; }
  .tag-name { font-weight:600; text-align:center; line-height:1.25; color:#000; width: 100%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break: break-word; padding:1px 0; }
  .tag-date-txt { font-size: 8px; font-weight: 600; color: #444; letter-spacing: 0.3px; line-height: 1.3; margin-top:1px;}
  .tag-mid-std { flex: 1 1 auto; display:flex; justify-content:space-between; align-items:flex-end; padding:2px 5px; overflow: hidden; gap:4px; }
  .tag-img-side { flex:0 0 auto; width:38%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .tag-img-side img { max-width:100%; max-height:100%; object-fit:contain; }
  .tag-info { display:flex; flex-direction:column; font-size:var(--meta-sz); color:#000; line-height:1.35; justify-content:flex-end; padding-bottom:1px;}
  .badge { background:#000; color:#fff; font-size:calc(var(--meta-sz) - 1px); font-weight:800; padding:1px 4px; border-radius:2px; margin-right:2px; display:inline-block; line-height:1.35; }
  .tag-price-wrap { display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; min-width: 0; }
  .tag-old { font-size:10px; color:#555; margin-bottom: -1px; text-decoration: line-through; line-height:1.3; }
  .tag-price-container { display: flex; align-items: baseline; justify-content: flex-end; width: 100%; }
  .tag-price-slide { transition: transform 0.2s; line-height: 0.95; }
  .tag-price { font-size:var(--price-sz); font-weight:900; letter-spacing:-1px; color:#000; }
  .tag-baht-anchor { margin-left: 2px; flex-shrink: 0; z-index: 2; }
  .tag-baht-inv  { background:#000; color:#fff; font-size:10px; font-weight:800; padding:2px 4px; border-radius:2px; }
  .tag-baht-norm { font-size:11px; font-weight:800; color:#000; }

  .tag-mid-dual { flex: 1 1 auto; min-height:0; display: flex; justify-content: space-between; align-items: center; padding: 3px 3px; overflow: hidden; gap:3px; }
  .dual-col { display: flex; flex-direction: column; align-items: center; justify-content:center; flex:1 1 0; min-width:0; max-width:50%; overflow:hidden; }
  .dual-div { width: 1px; align-self:stretch; border-right: 1px dashed #000; margin:4px 0; }
  .dual-badge { background: #000; color: #fff; font-size: calc(var(--meta-sz) - 1px); font-weight: 800; padding: 2px 6px; border-radius: 2px; margin-bottom: 3px; text-align: center; white-space: nowrap; line-height:1.35; max-width:100%; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; }
  .dual-price-row { display: flex; align-items: baseline; justify-content:center; width:100%; min-width:0; overflow:hidden; }
  .dual-price-val { font-size: var(--dual-price-sz); font-weight: 900; color: #000; letter-spacing: 0; line-height: 1.05; white-space:nowrap; min-width:0; }
  .dual-baht { font-size: calc(var(--meta-sz) - 1px); font-weight: 800; color: #000; margin-left: 3px; flex-shrink:0; white-space:nowrap; }

  .tag-mid-hero { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; padding:2px 6px 3px; overflow:hidden; }
  .hero-top { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:space-between; gap:5px; overflow:hidden; }
  .hero-meta { display:flex; flex-direction:column; font-size:var(--meta-sz); color:#000; line-height:1.35; min-width:0; overflow:hidden; }
  .hero-price-box { display:flex; align-items:baseline; flex-shrink:0; white-space:nowrap; }
  .hero-price { font-size:var(--price-sz); font-weight:900; letter-spacing:-1px; color:#000; line-height:1; white-space:nowrap; }
  .hero-baht { font-size:11px; font-weight:800; margin-left:2px; flex-shrink:0; }
  .wholesale-strip { background:#000; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; padding:2px 6px; margin-top:2px; border-radius:2px; overflow:hidden; min-width:0; flex-shrink:0; }
  .ws-label { font-size:calc(var(--meta-sz) - 1px); font-weight:700; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .ws-price { font-size:calc(var(--dual-price-sz) * 0.72); font-weight:900; line-height:1.1; white-space:nowrap; flex-shrink:0; }
  .ws-baht { font-size:calc(var(--meta-sz) - 1px); font-weight:700; white-space:nowrap; flex-shrink:0; }

  .tag-bc-area { flex: 0 0 42px; text-align:center; display:flex; justify-content:center; align-items:center; padding:2px 0; overflow: hidden; border-top: 1px dashed #000;}
  .tag-bc-area svg { max-width:98%; max-height:100%; }

  .price-tag-large { width: var(--large-w); height: var(--large-h); }
  .tag-name-area-large { flex: 0 0 46px; display:flex; align-items:center; justify-content:center; padding: 4px 10px; border-bottom: 2px solid #000; text-align: center; overflow: hidden;}
  .tag-name-large { font-weight:700; color:#000; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tag-large-body { flex: 1 1 auto; display: flex; border-bottom: 1px dashed #000; overflow:hidden;}
  .tag-large-left { width: 50%; padding: 5px 10px; display: flex; flex-direction: column; justify-content: center; font-size: calc(var(--meta-sz) + 2px); font-weight: 700; color: #000; line-height: 1.55; }
  .tag-large-img { max-width:80%; max-height:52px; object-fit:contain; margin:2px auto; }
  .tag-large-box { border: 2px solid #000; display: inline-flex; flex-direction: column; align-items: center; margin-top: 5px; border-radius: 4px; padding: 4px 10px; align-self: flex-start; }
  .tag-large-box-title { font-size: 10px; font-weight: 800; text-transform: uppercase; line-height: 1.2; }
  .tag-large-box-price { font-size: calc(var(--meta-sz) + 6px); font-weight: 900; line-height: 1.1; margin-top: 2px; }
  .tag-large-divider { width: 1px; border-right: 1px dashed #000; }
  .tag-large-right { width: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
  .tag-price-large { font-size: calc(var(--price-sz) * 1.3); font-weight: 900; letter-spacing: -1px; line-height: 0.95; color: #000; }
  .tag-baht-large { font-size: calc(var(--meta-sz) + 6px); font-weight: 800; color: #000; margin-left: 8px; }
  .pack-icon { display:inline-block; font-size:calc(var(--meta-sz) + 2px); margin-right:3px; }

  /* ============ LOC HEADER (รหัสชั้น-แถว บนหัวป้าย) — เพิ่มต่อจาก src/styles/tag.css ============ */
  .tag-header.hs { display:flex; align-items:center; gap:3px; padding:3px 2px; letter-spacing:0; }
  .hs-name { flex:1 1 auto; min-width:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:1px; }
  .loc-chip { flex:0 0 auto; background:#fff; color:#000; font-size:11px; font-weight:900; line-height:12px; padding:0 4px; border-radius:2px; white-space:nowrap; }
  .tag-header.hl { font-size:11px; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag-bc-area.has-date { position:relative; }
  .bc-date { position:absolute; right:2px; bottom:1px; font-size:8px; font-weight:700; line-height:1; background:#fff; color:#000; padding:0 1px; white-space:nowrap; }

  @media print {
    @page { margin:0; size: auto; }
    body { background:#fff !important; color:#000 !important; overflow:visible; }
    #print-area { width:100%; box-shadow:none !important; padding:2mm; gap:2mm; border:none !important; background:#fff !important; margin:0; min-height:0; }
    .empty-msg { display:none !important; }
    .price-tag { border: 2px solid #000 !important; background:#fff !important; box-shadow:none !important; transform:none !important; }
    .tag-header, .tag-ribbon, .badge, .tag-baht-inv, .dual-badge, .wholesale-strip { background:#000 !important; color:#fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wholesale-strip * { color:#fff !important; }
    .tag-name, .tag-price, .tag-info, .tag-baht-norm, .tag-old, .dual-price-val, .dual-baht, .tag-large-left, .tag-price-large, .tag-baht-large, .tag-date-txt, .hero-price, .hero-baht, .hero-meta { color:#000 !important; }
    .tag-name-area, .tag-name-area-large, .tag-large-box { border-color: #000 !important; }
    .tag-bc-area { border-top: 1px dashed #000 !important; }
    .tag-large-body { border-bottom: 1px dashed #000 !important; }
    .dual-div, .tag-large-divider { border-right: 1px dashed #000 !important; }
  }

  @media print {
    .loc-chip, .bc-date { background:#fff !important; color:#000 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  /* ============ ป้ายตู้แช่ (TagMode 'fridge') — ชื่อพิมพ์ + 888 เส้นกลวงระบายเมจิกเอง ============
   * ขาว-ดำล้วน #000/#fff เท่านั้น (เครื่องพิมพ์หมึกดำ) · ทุกขนาดอิงตัวป้าย (cqh/cqw) ปรับ W/H แล้วสเกลตามเอง
   * สัดส่วนจากแคนวาสดีไซน์ 60×35 มม.: หัว 19% · ชื่อ 10% · ตัวเลข 55%
   * ⚠️ ต้องตรงกับ src/styles/tag-fridge.css และ wongwian-tags-mobile/src/styles/tag-fridge.css ทุกตัวอักษร */
  .price-tag-fridge { width: var(--fridge-w); height: var(--fridge-h); border-radius: 1.3mm; container-type: size; color: #000; }
  .fr-head { flex: 0 0 19cqh; display: flex; align-items: center; justify-content: space-between; gap: 2cqw; padding: 0 3cqw; font-size: 8.5cqh; font-weight: 700; line-height: 1; white-space: nowrap; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fr-brand { display: flex; align-items: center; gap: 1.5cqw; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .fr-cn { font-family: 'Noto Serif SC', serif; font-weight: 900; flex-shrink: 0; }
  .fr-snow { width: 1.15em; height: 1.15em; flex-shrink: 0; }
  .fr-solid { background: #000; color: #fff; }
  .fr-line { background: #fff; color: #000; border-bottom: 0.8mm double #000; }
  .fr-line .fr-cn { background: #000; color: #fff; padding: 0.5cqh 1.2cqw; border-radius: 0.4mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fr-stripe { justify-content: center; background: repeating-linear-gradient(-45deg, #000 0 1.17mm, #fff 1.17mm 2.33mm); border-bottom: 0.5mm solid #000; }
  .fr-box { background: #fff; color: #000; border: 0.3mm solid #000; padding: 1cqh 2.5cqw; max-width: 100%; overflow: hidden; text-overflow: ellipsis; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fr-name { flex: 0 0 auto; display: flex; align-items: baseline; gap: 2cqw; padding: 1.5cqh 3cqw 0; font-size: 10cqh; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; }
  .fr-nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* ราคาตัวเล็กให้พนักงานรู้ว่าต้องระบายเลขอะไร — ขอบดำบาง ไม่ใช่สีเทา (พิมพ์หมึกดำอย่างเดียว) */
  .fr-guide { flex: 0 0 auto; font-size: 6.5cqh; font-weight: 700; border: 0.25mm solid #000; border-radius: 0.6mm; padding: 0 1.2cqw; line-height: 1.35; }
  .fr-blank .fr-price { align-items: center; padding-bottom: 2.5cqh; }
  .fr-price { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-end; justify-content: flex-end; gap: 2cqw; padding: 0 3.3cqw 3.5cqh; }
  .fr-digits { display: block; width: auto; flex-shrink: 0; }
  .fr-baht { font-size: 9cqh; font-weight: 700; line-height: 1; padding-bottom: 0.5cqh; }
  
  /* แผ่นป้ายตู้แช่ — ตารางเต็มแผ่น A4 ขึ้นหน้าใหม่ทุกแผ่น (ค่าตรงกับ FR_SHEET ใน fridge.ts)
   * แผ่นแรกสุดของงาน: #print-area มี padding 2 มม. อยู่แล้ว เลยเว้นบนแค่ 2.5 มม. */
  .fr-sheet { flex: 0 0 100%; width: 100%; display: grid; gap: 0.8mm; justify-content: center; align-content: start; padding-top: 4.5mm; break-before: page; page-break-before: always; break-inside: avoid; page-break-inside: avoid; }
  #print-area > .fr-sheet:first-child { padding-top: 2.5mm; break-before: auto; page-break-before: auto; }
  @media screen { .fr-sheet { outline: 1px dashed #b9b9cc; outline-offset: 1.5mm; margin: 2mm 0; } }
  
  @media print {
    .price-tag-fridge, .fr-name, .fr-baht { color: #000 !important; }
    .fr-solid { background: #000 !important; color: #fff !important; }
    .fr-stripe { background: repeating-linear-gradient(-45deg, #000 0 1.17mm, #fff 1.17mm 2.33mm) !important; }
    .fr-line, .fr-box { background: #fff !important; color: #000 !important; }
    .fr-line .fr-cn { background: #000 !important; color: #fff !important; }
  }

  /* ============ ป้ายแขวนกระเช้า (TagMode 'hamper') — แถบพับครึ่ง 2 หน้า แดง-เหลือง ============
   * ขนาดทุกอย่างเป็น cqw ของหน้าป้าย (กว้าง --hamper-w) ปรับขนาดแล้วสเกลตามเอง
   * ใช้คลาส .hamper-tag ไม่ใช่ .price-tag — เพราะ @media print ของ .price-tag บังคับพื้นขาวขอบดำ 2px
   * .hp-mono (config.printMono) = แดง→ดำ เหลือง→ขาว สำหรับเครื่องพิมพ์หมึกดำ
   * ⚠️ สำเนาตรงตัวของ src/styles/tag-hamper.css — แก้ที่นี่ต้องแก้ที่นั่นด้วย */
  .hamper-tag { --hp-red: #C8151D; --hp-yel: #FFD43B; --hp-ink: #1a1a1a; position: relative; width: var(--hamper-w); height: calc(var(--hamper-h) * 2); box-sizing: border-box; border: 0.25mm solid #000; background: #fff; color: var(--hp-ink); font-family: 'Kanit', sans-serif; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; cursor: pointer; break-inside: avoid; page-break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hamper-tag * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hamper-tag.hp-mono { --hp-red: #000; --hp-yel: #fff; }
  .hamper-tag.selected { box-shadow: 0 0 0 3px var(--ac, #4f46e5); }

  .hp-face { flex: 0 0 var(--hamper-h); height: var(--hamper-h); box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; }
  .hp-fold { flex: 0 0 0; border-top: 0.3mm dashed #000; position: relative; z-index: 1; }
  .hp-fill { flex: 1 1 auto; min-height: 0; }

  /* รูร้อยเชือก — วงประ = ที่แปะห่วงเสริม · วงใน = จุดเจาะ 5 มม. */
  .hp-hole { width: 13.8cqw; height: 13.8cqw; box-sizing: border-box; border: 0.8cqw dashed var(--hp-yel); border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: center; }
  .hp-hole > div { width: 7.7cqw; height: 7.7cqw; box-sizing: border-box; border: 0.6cqw solid var(--hp-ink); border-radius: 50%; }
  .hp-mono .hp-hole { border-color: #000; }

  /* ---- หน้าหลัง (กลับหัว) ---- */
  .hp-back { transform: rotate(180deg); background: var(--hp-red); align-items: center; padding-top: 5.7cqw; }
  .hp-fu { margin-top: 10cqw; width: 28.5cqw; height: 28.5cqw; background: var(--hp-yel); transform: rotate(45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1.2cqw var(--hp-red), 0 0 0 2cqw var(--hp-yel); flex-shrink: 0; }
  .hp-fu > span { transform: rotate(-45deg); color: var(--hp-red); font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 19.5cqw; line-height: 1; }
  .hp-greet { margin-top: 7cqw; color: #fff; font-size: 8.9cqw; font-weight: 800; line-height: 1.2; text-align: center; padding: 0 4cqw; }
  .hp-greet-cn { color: var(--hp-yel); font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 5.3cqw; letter-spacing: 2cqw; line-height: 1.6; text-align: center; }
  .hp-back-shop { width: 100%; text-align: center; color: #fff; font-size: 4.5cqw; font-weight: 700; padding: 1.6cqw 0 2.4cqw; line-height: 1.3; }
  .hp-back-shop .hp-cn { font-family: 'Noto Serif SC', serif; font-weight: 900; }

  /* ---- หน้าหน้า ---- */
  .hp-top { background: var(--hp-red); display: flex; flex-direction: column; align-items: center; padding: 4.9cqw 0 3.25cqw; }
  .hp-label { margin-top: 2.4cqw; display: flex; align-items: center; gap: 2.4cqw; color: #fff; font-size: 8.1cqw; font-weight: 800; line-height: 1.15; padding: 0 3cqw; text-align: center; }
  .hp-fu-chip { background: var(--hp-yel); color: var(--hp-red); font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 6.1cqw; padding: 0.4cqw 1.6cqw; border-radius: 1.2cqw; flex-shrink: 0; }
  .hp-mono .hp-fu-chip { background: #fff; color: #000; }
  .hp-body { padding: 0 4.9cqw; display: flex; flex-direction: column; align-items: center; gap: 2.4cqw; }
  .hp-name { font-weight: 800; line-height: 1.18; text-align: center; color: var(--hp-ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .hp-note { border: 0.6cqw solid var(--hp-red); color: var(--hp-red); border-radius: 999px; padding: 0.4cqw 4.9cqw; font-size: 5.7cqw; font-weight: 700; line-height: 1.4; text-align: center; max-width: 100%; box-sizing: border-box; }

  /* แถบราคาเหลือง — จุดที่สายตาต้องหยุด */
  .hp-band { position: relative; background: var(--hp-yel); border-top: 1.2cqw solid var(--hp-red); border-bottom: 1.2cqw solid var(--hp-red); display: flex; flex-direction: column; align-items: center; padding: 2.4cqw 0; }
  .hp-band-back { flex-direction: row; justify-content: center; align-items: flex-end; gap: 1.6cqw; width: 100%; border-color: var(--hp-yel); padding: 4cqw 0 3.2cqw; }
  .hp-mono .hp-band-back { border-color: #000; }
  .hp-price { display: flex; align-items: flex-end; gap: 1.6cqw; }
  .hp-num { display: inline-block; font-family: 'Potta One', cursive; line-height: .95; color: var(--hp-red); transform: rotate(-3deg); white-space: nowrap; }
  .hp-baht, .hp-pre { font-size: 7.3cqw; font-weight: 800; padding-bottom: 2.4cqw; color: var(--hp-ink); line-height: 1; }
  .hp-band-back .hp-baht, .hp-band-back .hp-pre { font-size: 6cqw; }
  .hp-sale { position: absolute; left: 3.25cqw; top: 1.6cqw; background: var(--hp-red); color: #fff; font-size: 4.9cqw; font-weight: 800; padding: 0 3.25cqw; border-radius: 1.2cqw; transform: rotate(-6deg); line-height: 1.5; white-space: nowrap; }
  .hp-old { font-size: 4.9cqw; font-weight: 700; line-height: 1.3; color: var(--hp-ink); }

  .hp-foot { display: flex; align-items: center; justify-content: space-between; gap: 2.4cqw; padding: 1.6cqw 3cqw 2cqw; min-height: 0; }
  .hp-shop { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .hp-shop b { font-size: 4.9cqw; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hp-shop .hp-cn { font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 4.5cqw; color: var(--hp-red); letter-spacing: 0.4cqw; }
  .hp-foot .bc-svg { display: block; flex-shrink: 0; max-height: 16cqw; }
  .hp-foot .bc-svg:not([width]) { width: 0; height: 0; } /* ยังไม่วาดบาร์โค้ด = ไม่กินที่ */

  /* แผ่นป้ายกระเช้า — ตาราง A4 ขึ้นหน้าใหม่ (ค่าตรงกับ HP_SHEET ใน hamper.ts) */
  .hp-sheet { flex: 0 0 100%; width: 100%; display: grid; gap: 2mm; justify-content: center; align-content: start; padding-top: 4.5mm; break-before: page; page-break-before: always; break-inside: avoid; page-break-inside: avoid; }
  #print-area > .hp-sheet:first-child { padding-top: 2.5mm; break-before: auto; page-break-before: auto; }
  @media screen { .hp-sheet { outline: 1px dashed #b9b9cc; outline-offset: 1.5mm; margin: 2mm 0; } }

  @media print {
    .hamper-tag { border: 0.25mm solid #000 !important; box-shadow: none !important; }
    .hp-back, .hp-top, .hp-sale { background: var(--hp-red) !important; }
    .hp-band, .hp-fu, .hp-fu-chip { background: var(--hp-yel) !important; }
    .hp-mono .hp-fu-chip { background: #fff !important; }
  }

  /* ============ OOS STRIP (แถบสินค้าหมด — ปิดทับช่องราคาของป้ายเดิม) ============ */
  .price-tag-oos { width: var(--oos-w); height: var(--oos-h); background:#000; flex-direction:row; align-items:center; justify-content:center; gap:8px; padding:0 8px; }
  .oos-main { color:#fff; font-size:var(--oos-sz); font-weight:900; letter-spacing:2px; line-height:1; white-space:nowrap; }
  .oos-eta  { color:#fff; font-size:calc(var(--meta-sz) + 1px); font-weight:700; border-left:1px solid #fff; padding-left:8px; white-space:nowrap; }
  @media print {
    /* แถบสินค้าหมดพื้นดำ — กฎ .price-tag { background:#fff !important } ด้านบนทำให้พิมพ์ออกมาขาวทั้งแถบ (ตัวหนังสือขาวบนขาว) */
    .price-tag.price-tag-oos { background:#000 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .oos-main, .oos-eta { color:#fff !important; }
    .oos-eta { border-left-color:#fff !important; }
  }

  /* ============================================================
   * INK / BRUSH PRICE + ชื่อจีนบนหัวป้าย — ส่วนเสริม (ไม่แตะ tag.css เดิม)
   * ทำงานเฉพาะเมื่อเปิดใช้ในตั้งค่า:
   *   .brush-price  → ตัวเลขราคาใช้ฟอนต์หมึกพู่กัน (var(--f-price))
   *   .ink-red      → ตัวเลขราคาสีแดงหมึก (พิมพ์สีจริงด้วย print-color-adjust)
   *   .ink-tilt     → เอียงตัวเลข + ขอบหมึกซึม
   *   .hdr-cn       → ตราชื่อจีนบนหัวป้าย
   * ⚠️ สำเนาตรงตัวจาก src/styles/tag-ink.css — แก้ที่นั่นต้องแก้ที่นี่ด้วย
   * ============================================================ */

  .price-tag.brush-price .tag-price,
  .price-tag.brush-price .hero-price,
  .price-tag.brush-price .dual-price-val,
  .price-tag.brush-price .tag-price-large,
  .price-tag.brush-price .ws-price,
  .price-tag.brush-price .tag-large-box-price {
    font-family: var(--f-price);
    font-weight: 400;
    letter-spacing: 0;
  }

  .price-tag.ink-red .tag-price,
  .price-tag.ink-red .hero-price,
  .price-tag.ink-red .dual-price-val,
  .price-tag.ink-red .tag-price-large,
  .price-tag.ink-red .tag-large-box-price {
    color: var(--ink-red);
  }

  .price-tag.ink-tilt .tag-price,
  .price-tag.ink-tilt .hero-price,
  .price-tag.ink-tilt .dual-price-val,
  .price-tag.ink-tilt .tag-price-large {
    display: inline-block;
    transform: rotate(-4deg);
    text-shadow: 0 0 1px currentColor;
  }

  .hdr-cn {
    display: inline-block;
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    background: #fff;
    color: #000;
    padding: 0 3px;
    margin-left: 4px;
    border-radius: 2px;
    letter-spacing: 1px;
    line-height: 1.25;
    vertical-align: middle;
  }
  .price-tag.ink-red .hdr-cn { background: var(--ink-red); color: #fff; }

  @media print {
    .price-tag.ink-red .tag-price,
    .price-tag.ink-red .hero-price,
    .price-tag.ink-red .dual-price-val,
    .price-tag.ink-red .tag-price-large,
    .price-tag.ink-red .tag-large-box-price {
      color: var(--ink-red) !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .tag-header .hdr-cn { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .price-tag.ink-red .tag-header .hdr-cn { background: var(--ink-red) !important; color: #fff !important; }
  }

  /* ============================================================
   * TAG THEMES — ธีมป้ายแบบ "เกาหลี" และ "หมึกแดง" (ใช้กับป้ายปกติเท่านั้น)
   * ออกแบบจากแคนวาส "อึ้งลักเส็ง ฟอนต์และสไตล์" (PriceTag / PriceTagInk)
   * ทำงานเมื่อ config.tagTheme = 'korean' | 'ink' — 'classic' = ป้ายเดิมทุกจุด
   * ขนาดทั้งหมดอิง --meta-sz / --price-sz จึงปรับจากแถบเลื่อนเดิมได้
   * ⚠️ สำเนาตรงตัวจาก src/styles/tag-theme.css — แก้ที่นั่นต้องแก้ที่นี่ด้วย
   * ============================================================ */

  .price-tag.theme-kr, .price-tag.theme-ink { background:#fff; }

  .th-head { flex:0 0 auto; min-height:18px; display:flex; align-items:center; justify-content:space-between; gap:4px; padding:2px 5px; color:#fff; font-size:calc(var(--meta-sz) + 1px); font-weight:800; line-height:1.3; white-space:nowrap; overflow:hidden; }
  .theme-kr .th-head { background:var(--th-accent); }
  .theme-ink .th-head { background:#000; }
  .th-brand { flex:1 1 auto; display:flex; align-items:center; gap:4px; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .th-brand > span:not(.loc-chip):not(.th-cn) { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .th-cn { font-family:'Noto Serif SC', serif; font-weight:900; letter-spacing:1px; flex-shrink:0; }
  .theme-ink .th-cn { background:var(--ink-red); color:#fff; padding:0 3px; border-radius:2px; }
  .th-sub { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-weight:600; font-size:calc(var(--meta-sz) - 1px); }
  .th-head .loc-chip { font-size:calc(var(--meta-sz) + 1px); line-height:1.2; }

  .th-body { flex:1 1 auto; min-height:0; position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:2px; padding:3px 6px 2px; overflow:hidden; container-type:size; }
  /* ชื่อ+ขนาดยอมหดเมื่อตัวเลขราคาใหญ่ — column-wrap: บรรทัดที่ไม่พอที่จะหลุดไปคอลัมน์ถัดไป (ซ่อน) ทั้งบรรทัด ไม่โดนตัดครึ่ง */
  .th-body > :first-child { flex:1 1 auto; min-height:16px; overflow:hidden; display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start; }
  .th-body > :first-child > * { width:100%; flex:0 0 auto; }
  .th-name { font-weight:700; color:#000; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
    .th-sizeline { font-size:var(--meta-sz); color:#333; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .th-row { flex:0 0 auto; display:flex; justify-content:space-between; align-items:flex-end; gap:4px; min-width:0; }
  .th-badges { display:flex; flex-direction:column; align-items:flex-start; gap:2px; font-size:calc(var(--meta-sz) - 1px); font-weight:700; min-width:0; overflow:hidden; padding-bottom:1px; }
  .th-badge-solid { background:#000; color:#fff; padding:0 4px; border-radius:2px; white-space:nowrap; line-height:1.4; }
  .th-badge-line { border:1px solid #000; color:#000; padding:0 4px; border-radius:2px; white-space:nowrap; line-height:1.3; }

  .th-price-col { display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0; }
  .theme-ink .th-price-col { flex-direction:row; align-items:center; gap:3px; }
  .th-pill { background:#000; color:#FFD43B; font-family:'Black Han Sans', sans-serif; font-size:calc(var(--meta-sz) - 1px); line-height:1.4; padding:0 6px; border-radius:999px; letter-spacing:.5px; }
  .th-price-row { display:flex; align-items:flex-end; gap:2px; }
  .th-price { font-size:1em; white-space:nowrap; line-height:.85; }
  .theme-kr .th-price { font-family:var(--f-th-price, 'Black Han Sans', sans-serif); color:var(--th-accent); letter-spacing:-1px; text-shadow:2px 2px 0 #FFD43B; }
  .theme-ink .th-price { display:inline-block; font-family:var(--f-th-price, 'Potta One', cursive); color:var(--ink-red); line-height:.95; transform:rotate(-4deg); text-shadow:0 0 1px currentColor; }
  .th-baht { color:#000; font-weight:800; font-size:calc(var(--meta-sz) + 1px); line-height:1; padding-bottom:2px; flex-shrink:0; }

  .th-stamp { width:calc(var(--meta-sz) * 2.1); height:calc(var(--meta-sz) * 2.1); margin-right:calc(var(--meta-sz) * 0.8); box-sizing:border-box; border:2px solid var(--ink-red); border-radius:3px; color:var(--ink-red); font-family:'Noto Serif SC', serif; font-weight:900; font-size:var(--meta-sz); line-height:1; display:grid; grid-template-columns:1fr 1fr; place-items:center; transform:rotate(8deg); opacity:.9; }

  .bc-branch { position:absolute; left:3px; bottom:1px; font-size:8px; font-weight:700; line-height:1; background:#fff; color:#000; padding:0 1px; white-space:nowrap; }

  @media print {
    .th-head, .th-cn, .th-pill, .th-badge-solid, .th-price, .th-stamp, .th-baht, .th-badge-line, .bc-branch { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .theme-kr .th-head { background:var(--th-accent) !important; color:#fff !important; }
    .theme-ink .th-head { background:#000 !important; color:#fff !important; }
    .theme-ink .th-cn { background:var(--ink-red) !important; color:#fff !important; }
    .th-badge-solid { background:#000 !important; color:#fff !important; }
    .th-pill { background:#000 !important; color:#FFD43B !important; }
    .theme-kr .th-price { color:var(--th-accent) !important; }
    .theme-ink .th-price { color:var(--ink-red) !important; }
    .th-stamp { color:var(--ink-red) !important; border-color:var(--ink-red) !important; }
    .th-name, .th-baht, .th-badge-line { color:#000 !important; }
  }

  /* ============================================================
   * ป้าย "เจ" หน้าชื่อสินค้า — ธงเหลืองตัวแดงแบบเทศกาลกินเจ (齋 + เจ)
   * ขนาดอิงตัวอักษรชื่อสินค้า (em) จึงปรับตามขนาดชื่อเอง
   * พิมพ์ขาวดำก็ยังอ่านออก: พื้นเหลือง → เทาอ่อน, ตัวแดง → เทาเข้ม
   * ⚠️ สำเนาตรงตัวจาก src/styles/tag-veg.css — แก้ที่นั่นต้องแก้ที่นี่ด้วย
   * ============================================================ */

  .veg-badge { display:inline-flex; align-items:center; gap:2px; vertical-align:middle; margin-right:4px; padding:0 4px 0 1px; background:#FFD400; color:#D7141A; border:1.5px solid #D7141A; border-radius:3px; font-weight:900; font-size:.8em; line-height:1.2; letter-spacing:0; white-space:nowrap; }
  .veg-cn { display:inline-block; background:#D7141A; color:#FFD400; font-family:'Noto Serif SC', serif; font-weight:900; border-radius:2px; padding:0 2px; line-height:1.2; }

  /* ธีมเกาหลี/หมึกแดง: ป้าย เจ ตัวใหญ่หน้าตัวเลขราคา — ขนาดอิงตัวเลขราคา (em ของ .th-price-row) */
  .veg-big { display:inline-flex; flex-direction:column; align-self:center; flex-shrink:0; margin-right:.8em; background:#FFD400; color:#D7141A; border:2px solid #D7141A; border-radius:4px; font-size:.3em; font-weight:900; line-height:1.1; text-align:center; overflow:hidden; transform:rotate(-6deg); }
  .veg-big .veg-cn { display:block; border-radius:0; padding:1px 4px; }
  .veg-big > span:last-child { padding:0 4px 1px; }

  @media print {
    .veg-badge, .veg-big, .veg-cn { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .veg-badge, .veg-big { background:#FFD400 !important; color:#D7141A !important; border-color:#D7141A !important; }
    .veg-cn { background:#D7141A !important; color:#FFD400 !important; }
  }

  /* ============================================================
   * พิมพ์ขาว-ดำ (config.printMono) — คลาส .mono บน .price-tag
   * เปลี่ยนแดง/เหลืองทุกจุดเป็นโทนดำ-เทา ให้เครื่องพิมพ์ขาวดำพิมพ์ออกมาคมชัด ไม่เป็นเม็ดเทาซีดๆ
   * ใช้ได้ทั้งป้ายแบบเดิม, ธีมเกาหลี, ธีมหมึกแดง และป้าย เจ
   * ใส่ !important ทุกบรรทัดเพื่อชนะ @media print เดิมใน tag-ink.css / tag-theme.css / tag-veg.css
   * ⚠️ สำเนาตรงตัวจาก src/styles/tag-mono.css — แก้ที่นั่นต้องแก้ที่นี่ด้วย
   * ============================================================ */

  /* หัวป้ายธีม: พื้นดำทึบ ตัวขาว ชื่อจีนเป็นกรอบขาวตัวดำ */
  .price-tag.mono .th-head { background:#000 !important; color:#fff !important; }
  .price-tag.mono .th-cn { background:#fff !important; color:#000 !important; padding:0 3px; border-radius:2px; }
  .price-tag.mono .hdr-cn { background:#fff !important; color:#000 !important; }

  /* ตัวเลขราคา: ดำสนิท — ธีมเกาหลีใช้เงาเทาแทนเงาเหลือง ให้ยังดูมีมิติ */
  .price-tag.mono .th-price,
  .price-tag.mono .tag-price,
  .price-tag.mono .hero-price,
  .price-tag.mono .dual-price-val,
  .price-tag.mono .tag-price-large,
  .price-tag.mono .tag-large-box-price { color:#000 !important; }
  .price-tag.mono.theme-kr .th-price { text-shadow:2px 2px 0 #b5b5b5 !important; }

  /* ป้าย SALE / ตรา 特价: ดำ-ขาว */
  .price-tag.mono .th-pill { background:#000 !important; color:#fff !important; }
  .price-tag.mono .th-stamp { color:#000 !important; border-color:#000 !important; }

  /* ป้าย เจ: กรอบดำพื้นขาว + 齋 กลับสีพื้นดำตัวขาว */

function renderAll(items, config) {
  applyCSSVars(config);
  var area = document.getElementById('print-area');
  /* ลำดับบนกระดาษ: ป้ายทั่วไป → แผ่นป้ายตู้แช่ (ตาราง A4 ขึ้นหน้าใหม่ 24 ใบ/แผ่นที่ 60×35 มม.)
   * → แผ่นป้ายกระเช้า (A4 ขึ้นหน้าใหม่ 3 ใบ/แผ่นที่ 6.5×19 ซม.) → แถบสินค้าหมด */
  var groups = [[], [], [], []];
  items.forEach(function (item) {
    var qty = Math.max(1, parseInt(item.PrintQty, 10) || 1);
    for (var k = 0; k < qty; k++) groups[printRank(item.TagMode)].push(buildTagHTML(item, config));
  });
  var sheet = fridgeSheetLayout(config);
  var sheetsHTML = chunkSheets(groups[1], sheet.perSheet).map(function (tags) {
    return '<div class="fr-sheet" style="grid-template-columns:repeat(' + sheet.cols + ', var(--fridge-w))">' + tags.join('') + '</div>';
  });
  var hpSheet = hamperSheetLayout(config);
  var hpSheetsHTML = chunkSheets(groups[2], hpSheet.perSheet).map(function (tags) {
    return '<div class="hp-sheet" style="grid-template-columns:repeat(' + hpSheet.cols + ', var(--hamper-w))">' + tags.join('') + '</div>';
  });
  var parts = groups[0].concat(sheetsHTML, hpSheetsHTML, groups[3]);
  var tagTotal = groups[0].length + groups[1].length + groups[2].length + groups[3].length;
  area.innerHTML = parts.length ? parts.join('') : '<div class="empty-msg">รอรับงานพิมพ์จากเครื่องหลัก...</div>';

  area.querySelectorAll('.bc-svg').forEach(function (svg) {
    var code = svg.getAttribute('data-barcode');
    if (!code) return;
    var isLarge = svg.getAttribute('data-large') === 'true';
    var bch = parseFloat(svg.getAttribute('data-bch')) || (isLarge ? 35 : 24);
    try {
      JsBarcode(svg, code, {
        format: 'CODE128',
        width: isLarge ? 2.2 : 1.4,
        height: bch,
        displayValue: true,
        fontSize: 11,
        font: 'sans-serif',
        fontOptions: 'bold',
        textMargin: 1,
        margin: 1,
      });
    } catch (e) {
      /* invalid barcode value — leave svg empty */
    }
  });

  return tagTotal;
}

function waitForImagesReady() {
  var imgs = Array.prototype.slice.call(document.querySelectorAll('#print-area img'));
  if (!imgs.length) return Promise.resolve();
  return Promise.race([
    Promise.all(
      imgs.map(function (img) {
        if (img.complete) return Promise.resolve();
        return new Promise(function (res) {
          img.onload = img.onerror = res;
        });
      }),
    ),
    new Promise(function (res) {
      setTimeout(res, 1500);
    }),
  ]);
}

/* the Google Fonts <link> above uses display=swap, so tag text renders in a fallback
 * font immediately and the real webfont (Kanit etc.) swaps in once its file finishes
 * downloading — asynchronously, with no relation to renderAll() returning. Printing
 * right after renderAll() (as before) could snapshot the page mid-swap, before the
 * real font arrived, especially on the very first job after opening/refreshing this
 * page. document.fonts.ready resolves once every font requested by the page's current
 * content has finished loading, so waiting on it here holds the print until the real
 * fonts are in — with a timeout fallback in case a font request stalls or 404s. */
function waitForFontsReady() {
  if (!(window.document && document.fonts && document.fonts.ready)) return Promise.resolve();
  return Promise.race([
    document.fonts.ready.catch(function () {}),
    new Promise(function (res) {
      setTimeout(res, 3000);
    }),
  ]);
}

/* ฟอนต์ที่ป้ายใช้ไม่ได้ถูกโหลดทันทีที่ใส่ HTML — เบราว์เซอร์จะเริ่มโหลดตอนจัดหน้า ซึ่งอาจเกิดหลัง
 * document.fonts.ready ถูกเช็กไปแล้ว (ready คืนค่าทันทีเพราะยังไม่มีฟอนต์ค้างโหลด) ทำให้พิมพ์ออกมาเป็นฟอนต์สำรอง
 * ฟอนต์พู่กัน/ธีม/จีน ไม่อยู่ใน warmUpFonts เดิม จึงโดนบ่อยที่สุด — สั่งโหลดฟอนต์ตาม config ให้ครบก่อนพิมพ์ */
function loadTagFonts(config) {
  if (!(window.document && document.fonts && document.fonts.load)) return Promise.resolve();
  var fams = [config.font, config.priceFont, "'Noto Serif SC'"];
  if (config.tagTheme === 'korean') fams.push("'Black Han Sans'");
  if (config.tagTheme === 'ink') fams.push("'Potta One'");
  /* ป้ายกระเช้าใช้ Kanit + Potta One เสมอ (ไม่ขึ้นกับธีม) */
  fams.push("'Kanit'", "'Potta One'");
  var sample = '0123456789,. บาทขนาดบรรจุเจ 齋黄六盛特价 특가 SALE';
  var jobs = [];
  fams.filter(Boolean).forEach(function (f) {
    [400, 700, 900].forEach(function (w) {
      jobs.push(document.fonts.load(w + ' 32px ' + f, sample).catch(function () {}));
    });
  });
  return Promise.race([
    Promise.all(jobs),
    new Promise(function (res) { setTimeout(res, 6000); }),
  ]);
}

/* kick the webfont downloads off as soon as the stylesheet is parsed, rather than
 * waiting for the first print job to render text and trigger them — gives the very
 * first job (right after a page load/refresh) the best chance the fonts are already
 * cached by the time waitForFontsReady() checks */
function warmUpFonts() {
  if (!(window.document && document.fonts && document.fonts.load)) return;
  ['IBM Plex Sans Thai', 'Kanit', 'Mitr', 'Prompt', 'Sarabun', 'Potta One', 'Black Han Sans', 'Noto Serif SC'].forEach(function (family) {
    [400, 700, 900].forEach(function (weight) {
      document.fonts.load(weight + ' 16px "' + family + '"').catch(function () {});
    });
  });
}

/* small beep for feedback — same oscillator approach as src/lib/audio.ts */
var audioCtx = null;
function beep() {
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new Ctor();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  } catch (e) {
    /* audio not available — non-critical */
  }
}
document.body.addEventListener('click', function () {
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new Ctor();
  } catch (e) {}
}, { once: true });

/* ============================================================
 * Ably connect / subscribe / status UI / auto-reconnect
 * ============================================================ */
var client = null;
var STATUS_TEXT = {
  connecting: 'กำลังเชื่อมต่อ...',
  connected: 'เชื่อมต่อพร้อมรับงานพิมพ์',
  offline: 'หลุดการเชื่อมต่อ — กำลังต่อใหม่ให้...',
};

function setStatus(state) {
  document.getElementById('tbDot').className = 'tb-dot ' + state;
  document.getElementById('tbStatusText').textContent = STATUS_TEXT[state] || state;
}

function connectAbly() {
  if (client) {
    try { client.close(); } catch (e) {}
    client = null;
  }
  setStatus('connecting');
  client = new Ably.Realtime({ key: ABLY_API_KEY });

  client.connection.on('connecting', function () { setStatus('connecting'); });
  client.connection.on('connected', function () { setStatus('connected'); });
  client.connection.on('disconnected', function () { setStatus('offline'); });
  client.connection.on('suspended', function () { setStatus('offline'); });
  client.connection.on('failed', function () { setStatus('offline'); });

  var channel = client.channels.get(CHANNEL_NAME);
  channel.subscribe(EVENT_NAME, function (msg) {
    handlePayload(typeof msg.data === 'string' ? msg.data : JSON.stringify(msg.data));
  });
}

function fmtTime(d) {
  var pad = function (n) { return String(n).padStart(2, '0'); };
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

/* ============================================================
 * Batch accumulation — a large queue from wongwian-tags is split across several
 * Ably messages (see src/lib/printBridge.ts). Messages sharing a batchId are buffered
 * here until all of them arrive, then rendered/printed as a single job. batchTotal<=1
 * (or missing, e.g. the "ทดสอบพิมพ์ตัวอย่าง" button) means a self-contained payload,
 * handled immediately with no buffering.
 * ============================================================ */
var pendingBatch = null; // { batchId, batchTotal, config, chunks: QueueItem[][] }
var pendingBatchTimer = null;
var BATCH_TIMEOUT_MS = 20000;

function clearPendingBatch() {
  if (pendingBatchTimer) {
    clearTimeout(pendingBatchTimer);
    pendingBatchTimer = null;
  }
  pendingBatch = null;
}

function pendingBatchReceivedCount() {
  if (!pendingBatch) return 0;
  var n = 0;
  for (var i = 0; i < pendingBatch.chunks.length; i++) if (pendingBatch.chunks[i] !== undefined) n++;
  return n;
}

/* known TagMode values this printer knows how to render — a value outside this list
 * means the sender (wongwian-tags-mobile) shipped a tag type this printer predates.
 * ห้ามพิมพ์เงียบ: refuse the whole job and warn instead of silently rendering a
 * blank/wrong tag for the unknown mode. */
var VALID_TAG_MODES = ['standard', 'dual', 'large', 'oos', 'fridge'];

function showWarning(msg) {
  var el = document.getElementById('warnBanner');
  if (el) {
    el.textContent = msg;
    el.hidden = false;
  }
  beep();
}

function hideWarning() {
  var el = document.getElementById('warnBanner');
  if (el) el.hidden = true;
}

function finalizePrint(items, config) {
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (!VALID_TAG_MODES.includes(it.TagMode)) {
      showWarning('ได้รับป้ายชนิดที่ไม่รู้จัก: ' + it.TagMode + ' — กรุณาอัปเดตเครื่องพิมพ์ก่อน');
      return;
    }
  }
  hideWarning();

  var tagCount = renderAll(items, config);
  /* บอกว่างานนี้ถูกส่งมาแบบไหน — ถ้าติ๊กขาว-ดำแล้วยังขึ้น "สี" แปลว่าเครื่องที่กดส่งยังไม่ได้ติ๊ก */
  var modeLbl = (config.printMono ? 'ขาว-ดำ' : 'สี') + (config.tagTheme === 'korean' ? ' · ธีมเกาหลี' : config.tagTheme === 'ink' ? ' · ธีมหมึกแดง' : '');
  var frSheets = document.querySelectorAll('#print-area .fr-sheet').length;
  if (frSheets) modeLbl += ' · ตู้แช่ ' + frSheets + ' แผ่น';
  document.getElementById('tbLastPrint').textContent = fmtTime(new Date()) + ' · ' + tagCount + ' ใบ · ' + modeLbl;
  beep();
  Promise.all([loadTagFonts(config), waitForImagesReady()]).then(waitForFontsReady).then(function () {
    window.print();
  });
}

function handlePayload(raw) {
  var data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    return;
  }
  var config = normalizeConfig(data.config);
  var itemsRaw = Array.isArray(data.items) ? data.items : [];
  var items = itemsRaw.map(normalizeItem);
  var batchTotal = typeof data.batchTotal === 'number' && data.batchTotal > 0 ? data.batchTotal : 1;

  if (batchTotal <= 1) {
    clearPendingBatch();
    finalizePrint(items, config);
    return;
  }

  var batchId = data.batchId;
  var batchIndex = typeof data.batchIndex === 'number' ? data.batchIndex : 0;

  if (!pendingBatch || pendingBatch.batchId !== batchId) {
    clearPendingBatch();
    pendingBatch = { batchId: batchId, batchTotal: batchTotal, config: config, chunks: new Array(batchTotal) };
    pendingBatchTimer = setTimeout(function () {
      document.getElementById('tbLastPrint').textContent =
        'งานพิมพ์ไม่ครบ (' + pendingBatchReceivedCount() + '/' + batchTotal + ') — หมดเวลารอ';
      pendingBatch = null;
    }, BATCH_TIMEOUT_MS);
  }

  pendingBatch.chunks[batchIndex] = items;
  var receivedCount = pendingBatchReceivedCount();
  document.getElementById('tbLastPrint').textContent = 'กำลังรับงานพิมพ์... (' + receivedCount + '/' + batchTotal + ')';

  if (receivedCount === batchTotal) {
    var allItems = [].concat.apply([], pendingBatch.chunks);
    var finalConfig = pendingBatch.config;
    clearPendingBatch();
    finalizePrint(allItems, finalConfig);
  }
}

document.getElementById('tbTopic').textContent = CHANNEL_NAME;
document.getElementById('tbReconnectBtn').addEventListener('click', connectAbly);
document.getElementById('tbTestBtn').addEventListener('click', function () {
  var demoItems = [
    normalizeItem({ Barcode: '8850999123456', ProductName: 'ทดสอบพิมพ์ป้ายราคา (มาตรฐาน)', TagMode: 'standard', Price: '39.00', Size: '500 มล.', PrintQty: 1 }),
    normalizeItem({ Barcode: '8850999654321', ProductName: 'ทดสอบพิมพ์ป้าย (ราคาคู่)', TagMode: 'dual', Price: '25.00', Price2: '220.00', Unit2: 'ยกลัง', PrintQty: 1 }),
    normalizeItem({ Barcode: '8850999111222', ProductName: 'ทดสอบพิมพ์ป้าย (มีรหัสชั้น-แถว)', TagMode: 'standard', Price: '15.00', Size: '1 ชิ้น', Loc: 'A-3', Printed: '17/9/69', PrintQty: 1 }),
    normalizeItem({ Barcode: '8850999333444', ProductName: 'ทดสอบป้ายแขวนกระเช้า', TagMode: 'hamper', Price: '1095', OldPrice: '1250', HamperNote: '12 ขวด · พร้อมถุงหิ้ว', PrintQty: 1 }),
    normalizeItem({ Barcode: '8850999333444', ProductName: 'ทดสอบป้ายตู้แช่ (ระบายราคาเอง)', TagMode: 'fridge', Price: '12', PrintQty: 1 }),
    normalizeItem({ Barcode: '', ProductName: '', TagMode: 'fridge', Price: '', PrintQty: 1 }),
  ];
  var tagCount = renderAll(demoItems, normalizeConfig({}));
  document.getElementById('tbLastPrint').textContent = fmtTime(new Date()) + ' · ' + tagCount + ' ใบ (ทดสอบ)';
  Promise.all([waitForFontsReady(), waitForImagesReady()]).then(function () {
    window.print();
  });
});

warmUpFonts();

/* หน้านี้เปิดค้างไว้ทั้งวัน — ถ้ามีรุ่นใหม่ขึ้นเว็บ (PRINTER_BUILD เปลี่ยน) ให้รีโหลดตัวเองตอนว่าง
 * ไม่งั้นฟีเจอร์ใหม่ (เช่น พิมพ์ขาว-ดำ) จะไม่ทำงานจนกว่าจะมีคนกดรีเฟรชเอง */
function checkForUpdate() {
  if (location.protocol === 'file:' || pendingBatch || !window.fetch) return;
  fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var m = t.match(/var PRINTER_BUILD = '([^']+)'/);
      if (m && m[1] !== PRINTER_BUILD) location.reload();
    })
    .catch(function () {});
}
setInterval(checkForUpdate, 5 * 60 * 1000);
document.getElementById('tbBuild').textContent = PRINTER_BUILD;

connectAbly();
</script>
