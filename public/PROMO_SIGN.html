<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ป้ายโปรโมชัน A4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f1efe9; --ink:#222; --line:#d8d3c6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Kanit',sans-serif; background:var(--bg); color:var(--ink); }
  .bar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  .bar label { display:flex; flex-direction:column; font-size:12px; gap:3px; color:#555; }
  .bar input[type=text], .bar input[type=number] { font:inherit; font-size:16px; padding:6px 8px; border:1px solid #bbb; border-radius:6px; width:150px; }
  .bar input.wide { width:230px; }
  .bar .chk { flex-direction:row; align-items:center; gap:6px; font-size:14px; color:#222; padding-bottom:7px; }
  .bar button { font:inherit; font-size:16px; padding:8px 18px; border:0; border-radius:8px; background:#c0141c; color:#fff; cursor:pointer; }
  .bar button.alt { background:#444; }
  .stage { display:flex; justify-content:center; padding:18px; }
  .sheet { background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.25); width:min(96vw, 1123px); }
  .sheet svg { display:block; width:100%; height:auto; }
  .mono svg { filter:grayscale(1) contrast(1.4); }
  .hint { text-align:center; font-size:12px; color:#777; padding-bottom:20px; }
  @page { size:A4 landscape; margin:0; }
  @media print {
    body { background:#fff; }
    .bar, .hint { display:none; }
    .stage { padding:0; display:block; }
    .sheet { box-shadow:none; width:100%; }
    .sheet svg { width:100vw; height:100vh; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div class="bar">
  <label>ชื่อสินค้า (ไม่ใส่ก็ได้)<input id="name" class="wide" type="text" value="ซีอิ๊วขาว เมกาเชฟ"></label>
  <label>ราคาเดิม (บาท)<input id="old" type="number" min="0" step="any" value="29"></label>
  <label>ราคาใหม่ (บาท)<input id="now" type="number" min="0" step="any" value="15"></label>
  <label>ลด % (เว้นว่าง = คำนวณเอง)<input id="pct" type="number" min="0" max="99" step="any" placeholder="อัตโนมัติ"></label>
  <label>คำหน้า % <input id="wPct" type="text" value="ลด" style="width:80px"></label>
  <label>คำหน้าราคาใหม่<input id="wNow" type="text" value="เหลือ" style="width:90px"></label>
  <label>หน่วย<input id="wUnit" type="text" value="บาท" style="width:80px"></label>
  <label>ข้อความใหญ่<input id="sale" type="text" value="SALE" style="width:110px"></label>
  <label>หมายเหตุเล็กๆ ท้ายป้าย<input id="note" class="wide" type="text" placeholder="เช่น วันนี้ - 31 ต.ค."></label>
  <label>แนวกระดาษ<select id="orient" style="font:inherit;font-size:16px;padding:6px"><option value="l">แนวนอน</option><option value="p">แนวตั้ง</option></select></label>
  <label class="chk"><input id="mono" type="checkbox"> ขาว-ดำ</label>
  <button id="print">พิมพ์ A4</button>
  <button id="reset" class="alt" type="button">ล้างค่า</button>
</div>
<div class="stage"><div class="sheet" id="sheet"></div></div>
<div class="hint">ตั้งค่าเครื่องพิมพ์: กระดาษ A4, ขนาด 100%, ไม่ต้องมีหัว/ท้ายกระดาษ (Margins: None) — ถ้าหน้าต่างพิมพ์ไม่เลือกแนวให้เอง ให้เลือกตามที่เลือกด้านบน</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var GREEN = '#15803d', RED = '#d4161c', YEL = '#ffe500', BLK = '#161616';

  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(n) {
    var v = Number(n);
    if (!isFinite(v)) return '';
    return (Math.round(v * 100) / 100).toLocaleString('en-US');
  }
  /* ดาวกระจาย: จุดสลับวงนอก/วงใน */
  function burst(cx, cy, rx, ry, n, inner, jag) {
    var pts = [];
    for (var i = 0; i < n * 2; i++) {
      var a = (Math.PI * i) / n - Math.PI / 2;
      var k = i % 2 === 0 ? 1 : inner;
      if (i % 2 === 0 && jag) k *= 1 - jag * ((i / 2) % 3 === 0 ? 1 : 0);
      pts.push((cx + Math.cos(a) * rx * k).toFixed(2) + ',' + (cy + Math.sin(a) * ry * k).toFixed(2));
    }
    return pts.join(' ');
  }

  var IDS = ['name', 'old', 'now', 'pct', 'wPct', 'wNow', 'wUnit', 'sale', 'note', 'orient', 'mono'];
  var KEY = 'promoSignV1';
  function save() {
    try {
      var o = {};
      IDS.forEach(function (id) { o[id] = id === 'mono' ? $(id).checked : $(id).value; });
      localStorage.setItem(KEY, JSON.stringify(o));
    } catch (e) { /* ใช้ได้ปกติแม้จำค่าไม่ได้ */ }
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!o) return;
      IDS.forEach(function (id) { if (o[id] == null) return; if (id === 'mono') $(id).checked = !!o[id]; else $(id).value = o[id]; });
    } catch (e) { /* ข้าม */ }
  }

  function render() {
    var land = $('orient').value === 'l';
    var W = land ? 297 : 210, H = land ? 210 : 297;
    var s = Math.min(W / 297, H / 210) * (land ? 1 : 1.08);
    var old = parseFloat($('old').value), now = parseFloat($('now').value);
    var pctIn = $('pct').value.trim();
    var pct = pctIn !== '' ? Number(pctIn) : (old > 0 && now >= 0 && now < old ? Math.round((old - now) / old * 100) : 0);
    var wPct = $('wPct').value.trim(), wNow = $('wNow').value.trim(), wUnit = $('wUnit').value.trim();
    save();
    var name = $('name').value.trim(), note = $('note').value.trim(), sale = $('sale').value.trim();

    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, xmlns: NS });
    svg.appendChild(el('rect', { width: W, height: H, fill: '#fffbe6' }));
    /* ลายเส้นรัศมีจางๆ ด้านหลัง */
    var rays = el('g', { opacity: '.5' });
    for (var r = 0; r < 24; r++) {
      var a1 = (Math.PI * 2 * r) / 24, a2 = a1 + Math.PI / 24, R = Math.max(W, H);
      rays.appendChild(el('polygon', { fill: '#fff1a8',
        points: (W / 2) + ',' + (H / 2) + ' ' + (W / 2 + Math.cos(a1) * R) + ',' + (H / 2 + Math.sin(a1) * R) + ' ' + (W / 2 + Math.cos(a2) * R) + ',' + (H / 2 + Math.sin(a2) * R) }));
    }
    svg.appendChild(rays);

    var cx = W / 2, cy = H / 2, rx = W * 0.485, ry = H * 0.485;
    svg.appendChild(el('polygon', { points: burst(cx, cy, rx, ry, 22, 0.84), fill: RED }));
    svg.appendChild(el('polygon', { points: burst(cx, cy, rx * 0.975, ry * 0.975, 22, 0.84), fill: BLK }));
    svg.appendChild(el('polygon', { points: burst(cx, cy, rx * 0.95, ry * 0.95, 22, 0.84), fill: YEL }));

    function T(txt, x, y, size, fill, extra) {
      var a = { x: x, y: y, 'font-size': size * s, 'font-family': 'Kanit,sans-serif', 'font-weight': 900, 'text-anchor': 'middle', fill: fill };
      for (var k in (extra || {})) a[k] = extra[k];
      svg.appendChild(el('text', a, txt));
    }
    var y = {
      name: H * 0.205, pct: H * 0.345, old: H * 0.455, now: H * 0.725, sale: H * 0.89, note: H * 0.95,
    };
    if (name) T(name, cx, y.name, 12, BLK, { 'font-weight': 800, textLength: Math.min(name.length * 6.6 * s, W * 0.5), lengthAdjust: 'spacingAndGlyphs' });

    if (pct > 0) {
      T((wPct ? wPct + ' ' : '') + pct + '%', cx, y.pct, 34, GREEN, { stroke: BLK, 'stroke-width': 0.9 * s, 'paint-order': 'stroke' });
    }
    if (old > 0) {
      var oldTxt = '( ' + fmt(old) + (wUnit ? ' ' + wUnit : '') + ' )';
      var ow = oldTxt.length * 6.2 * s;
      T(oldTxt, cx, y.old, 17, GREEN, { 'font-weight': 800 });
      svg.appendChild(el('line', { x1: cx - ow * 0.58, x2: cx + ow * 0.58, y1: y.old - 5.2 * s, y2: y.old - 6.6 * s, stroke: BLK, 'stroke-width': 1.3 * s, 'stroke-linecap': 'round' }));
    }
    /* ราคาใหม่: เหลือ [ตัวเลขใหญ่] บาท — ปรับขนาดตามจำนวนหลัก */
    var nowTxt = fmt(now);
    var digits = nowTxt.length;
    var big = digits <= 2 ? 70 : digits <= 3 ? 60 : digits <= 5 ? 48 : 38;
    var t = el('text', { x: cx, y: y.now, 'text-anchor': 'middle', 'font-family': 'Kanit,sans-serif', 'font-weight': 900, fill: GREEN });
    var a = el('tspan', { 'font-size': 27 * s }, wNow ? wNow + ' ' : '');
    var b = el('tspan', { 'font-size': big * s, fill: RED, stroke: BLK, 'stroke-width': 1.2 * s, 'paint-order': 'stroke' }, nowTxt);
    var c = el('tspan', { 'font-size': 27 * s }, wUnit ? ' ' + wUnit : '');
    t.appendChild(a); t.appendChild(b); t.appendChild(c);
    svg.appendChild(t);

    if (sale) {
      T(sale, cx, y.sale, 32, BLK, { stroke: '#fff', 'stroke-width': 1.6 * s, 'paint-order': 'stroke', 'letter-spacing': 2 * s });
    }
    if (note) T(note, cx, y.note, 8.5, BLK, { 'font-weight': 600 });

    var sheet = $('sheet');
    sheet.innerHTML = '';
    sheet.appendChild(svg);
    sheet.style.aspectRatio = W + ' / ' + H;
    sheet.style.width = land ? 'min(96vw, 1123px)' : 'min(96vw, 794px)';
    sheet.className = 'sheet' + ($('mono').checked ? ' mono' : '');

    var st = document.getElementById('pagestyle');
    if (!st) { st = document.createElement('style'); st.id = 'pagestyle'; document.head.appendChild(st); }
    st.textContent = '@page{size:A4 ' + (land ? 'landscape' : 'portrait') + ';margin:0}';
  }

  IDS.forEach(function (id) {
    $(id).addEventListener('input', render);
    $(id).addEventListener('change', render);
  });
  $('print').addEventListener('click', function () { (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { window.print(); }); });
  $('reset').addEventListener('click', function () { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); });
  load();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
